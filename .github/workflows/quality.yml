name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      G_ONE_DB_PASSWORD: ci-database-password
      G_ONE_DB_ROOT_PASSWORD: ci-root-password
      G_ONE_JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
      G_ONE_CONSOLE_PASSWORD: ci-console-password
      # A deterministic, non-production 32-byte key used only to validate Compose interpolation.
      G_ONE_WIREGUARD_PRIVATE_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      # Invoke pytest through the selected interpreter and keep repository
      # deployment helpers importable from the checkout.
      - run: python -m pytest -q
      - name: Verify installed wheel contains migrations
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv --system-site-packages /tmp/g-one-wheel-test
          /tmp/g-one-wheel-test/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/g-one-wheel-test/bin/python -c "from g_one.migrations import upgrade_database; upgrade_database('sqlite:////tmp/g-one-wheel-test.db')"
      - run: |
          G_ONE_DATABASE_URL=sqlite:///./migration-check.db alembic upgrade head
          G_ONE_DATABASE_URL=sqlite:///./migration-check.db alembic check
      - run: docker compose config
