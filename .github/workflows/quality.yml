name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      G_ONE_DB_PASSWORD: ci-database-password
      G_ONE_DB_ROOT_PASSWORD: ci-root-password
      G_ONE_JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
      G_ONE_CONSOLE_PASSWORD: ci-console-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests migrations
      - run: pytest -q
      - run: |
          G_ONE_DATABASE_URL=sqlite:///./migration-check.db alembic upgrade head
          G_ONE_DATABASE_URL=sqlite:///./migration-check.db alembic check
      - run: docker compose config
