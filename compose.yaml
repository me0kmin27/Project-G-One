name: g-one

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${G_ONE_DB_NAME:-g_one}
      MARIADB_USER: ${G_ONE_DB_USER:-g_one}
      MARIADB_PASSWORD: ${G_ONE_DB_PASSWORD:?run python3 scripts/setup_server.py first}
      MARIADB_ROOT_PASSWORD: ${G_ONE_DB_ROOT_PASSWORD:?run python3 scripts/setup_server.py first}
    volumes:
      - g-one-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      G_ONE_ENVIRONMENT: production
      G_ONE_DATABASE_URL: mysql+pymysql://${G_ONE_DB_USER:-g_one}:${G_ONE_DB_PASSWORD}@database:3306/${G_ONE_DB_NAME:-g_one}?charset=utf8mb4
      G_ONE_JWT_SECRET: ${G_ONE_JWT_SECRET:?run scripts/ensure_compose_env.py first}
      G_ONE_JWT_ISSUER: ${G_ONE_JWT_ISSUER:-g-one}
      G_ONE_JWT_AUDIENCE: ${G_ONE_JWT_AUDIENCE:-g-one-api}
      G_ONE_CONSOLE_PASSWORD: ${G_ONE_CONSOLE_PASSWORD:?run scripts/ensure_compose_env.py first}
      G_ONE_WIREGUARD_PRIVATE_KEY: ${G_ONE_WIREGUARD_PRIVATE_KEY:?run scripts/ensure_compose_env.py first}
      G_ONE_WIREGUARD_APPLY: ${G_ONE_WIREGUARD_APPLY:-true}
      G_ONE_WIREGUARD_INTERFACE: wg0
      G_ONE_WIREGUARD_CONFIG_PATH: /etc/wireguard/wg0.conf
      G_ONE_WINDOWS_CLIENT_ARTIFACT: /opt/g-one/client/GOne.Client.msi
    user: root
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${G_ONE_HTTP_BIND:-0.0.0.0}:${G_ONE_HTTP_PORT:-8000}:8000"
      - "${G_ONE_WIREGUARD_PORT:-51820}:${G_ONE_WIREGUARD_PORT:-51820}/udp"
    volumes:
      - g-one-wireguard:/etc/wireguard
      - ./.deploy/windows-client:/opt/g-one/client:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    init: true

volumes:
  g-one-database:
  g-one-wireguard:

networks:
  backend:
